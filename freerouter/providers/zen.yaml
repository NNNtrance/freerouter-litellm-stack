id: zen
name: OpenCode Zen
name_zh: OpenCode Zen
# PAUSED 2026-10-17: even space-bunny-free -- the one id that used to answer from outside
# OpenCode -- now refuses with 403 FreeTierError "OpenCode's free tier can only be used from
# within OpenCode". Live probe on 2026-10-17 confirmed it; its last good answer was 2026-10-10,
# so the pool row has been dead since (pool doctor alerted nightly, then suppressed). A
# client-locked free tier is not pool material at any point: the pool cannot fake being the
# OpenCode client. Un-pause only if a probe of space-bunny-free returns 200 again.
status: paused
tier: free
region: global
credential: <REDACTED_API_KEY>
litellm_prefix: openai
api_base: https://opencode.ai/zen/v1
docs_url: https://opencode.ai/docs/zen
console_url: https://opencode.ai/auth
summary: OpenCode 官方网关，space-bunny-free 对外可用（其余 -free 模型仅限 OpenCode 客户端内使用）
free_basis: 官方免费促销模型；2026-10-04 用本账号 key 实测 space-bunny-free 返回 200，其余 10 个 -free 模型返回 403 FreeTierError「can only be used from within OpenCode」，故只放行可外部调用的一条
free_basis_checked: 2026-10-04
max_models: 3
limits:
  note: 免费促销档，官方未公开 RPM/RPD
discovery:
  # /v1/models 返回 42 条（含大量付费模型）；-free 后缀只是标记，真正能外部调用的只有 space-bunny-free
  mode: listing
  url: https://opencode.ai/zen/v1/models
  auth: <REDACTED_API_KEY>
  items_path: data
  id_path: id
  allow:
    - "space-bunny-free"
probe:
  max_per_cycle: 1
